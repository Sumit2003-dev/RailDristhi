<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="train-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nose-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#train-bg)" />

  <!-- Dual Track Lines below -->
  <path d="M12 52 L52 52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  <path d="M16 56 L48 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25" />
  <path d="M20 50 L20 58 M28 50 L28 58 M36 50 L36 58 M44 50 L44 58" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Modern Bullet / Locomotive Aerodynamic Body -->
  <path d="M20 44 L20 22 C20 13 25 10 32 10 C39 10 44 13 44 22 L44 44 Z" fill="#ffffff" />

  <!-- Windshield / Panoramic Driver Glass -->
  <path d="M24 22 C24 16 27 14 32 14 C37 14 40 16 40 22 L40 28 L24 28 Z" fill="#0f172a" />
  <!-- Windshield Reflection -->
  <path d="M26 18 C28 16 30 15 33 15 L32 26 L26 26 Z" fill="#38bdf8" opacity="0.6" />

  <!-- Saffron Aero Stripe -->
  <path d="M20 32 L44 32 L44 35 L20 35 Z" fill="url(#nose-accent)" />

  <!-- Dual LED Headlights -->
  <circle cx="25" cy="40" r="2.5" fill="#fef08a" filter="url(#glow)" />
  <circle cx="39" cy="40" r="2.5" fill="#fef08a" filter="url(#glow)" />
  <circle cx="32" cy="38" r="1.5" fill="#2563eb" />

  <!-- Bottom Cowcatcher / Track Guard -->
  <path d="M24 44 L40 44 L38 48 L26 48 Z" fill="#cbd5e1" />
</svg>
